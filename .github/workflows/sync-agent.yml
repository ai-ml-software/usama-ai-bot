name: Sync Pollinations code agent
on:
  push:
    branches: [main]
    paths: [agent.ts, README.md]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync when configured
        env:
          SYNC_URL: ${{ vars.POLLINATIONS_SYNC_URL }}
        run: |
          if [ -z "$SYNC_URL" ]; then echo "POLLINATIONS_SYNC_URL is not set; skipping"; exit 0; fi
          case "$SYNC_URL" in https://gen.pollinations.ai/account/agents/*/sync) ;; *) echo "Unexpected sync URL"; exit 1 ;; esac
          curl --fail --retry 2 --retry-delay 30 --request POST "$SYNC_URL"
