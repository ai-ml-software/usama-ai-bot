name = "telegram-media-director"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[vars]
IMAGE_MODEL = "flux"
VIDEO_MODEL = "google/veo-3.1-fast"
VIDEO_DURATION = "4"
POLLINATIONS_BASE_URL = "https://gen.pollinations.ai"

[[queues.producers]]
binding = "MEDIA_QUEUE"
queue = "telegram-media-generation"

[[queues.consumers]]
queue = "telegram-media-generation"
max_batch_size = 1
max_retries = 2
max_batch_timeout = 5
